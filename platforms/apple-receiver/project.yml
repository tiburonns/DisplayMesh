name: DisplayMeshReceiver

options:
  bundleIdPrefix: com.tiburonns
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: 5.0
    SWIFT_STRICT_CONCURRENCY: targeted
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    PRODUCT_NAME: DisplayMesh
    CURRENT_PROJECT_VERSION: 2
    MARKETING_VERSION: 0.2.1

targets:
  DisplayMeshReceiver:
    type: application
    platform: iOS
    sources:
      - App
      - Protocol
      - Sources
    resources:
      - Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tiburonns.DisplayMesh.Receiver
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: DisplayMesh
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: DisplayMesh uses your local network to connect this iPhone or iPad as an external display.
        NSBonjourServices:
          - _displaymesh._tcp
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UILaunchScreen: {}
    scheme:
      testTargets:
        - DisplayMeshReceiverTests

  DisplayMeshReceiverTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Tests
    dependencies:
      - target: DisplayMeshReceiver
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
