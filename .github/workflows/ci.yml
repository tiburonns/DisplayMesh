name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate repository contract
        run: python3 scripts/validate-contract.py

      - name: Validate Apple receiver resources
        run: python3 scripts/validate-apple-receiver.py

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all --check

      - name: Check workspace
        run: cargo check --workspace --all-targets

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test workspace
        run: cargo test --workspace

  apple-receiver:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate receiver resources
        run: python3 scripts/validate-apple-receiver.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: platforms/apple-receiver
        run: xcodegen generate

      - name: Build receiver for iOS Simulator
        working-directory: platforms/apple-receiver
        run: |
          xcodebuild \
            -project DisplayMeshReceiver.xcodeproj \
            -scheme DisplayMeshReceiver \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run receiver unit tests
        working-directory: platforms/apple-receiver
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin)["devices"]; print(next(device["udid"] for devices in data.values() for device in devices if device.get("isAvailable")))')
          xcodebuild \
            -project DisplayMeshReceiver.xcodeproj \
            -scheme DisplayMeshReceiver \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            test

  macos-media-harness:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Build low-latency media harness
        run: swift build --package-path platforms/macos/media-harness

      - name: Test DMP media contract
        run: swift test --package-path platforms/macos/media-harness

  macos-native-harness:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Compile virtual-display harness
        run: make -C platforms/macos/harness

  windows-bootstrap:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Configure bootstrap
        run: cmake -S platforms/windows/bootstrap -B build/windows-bootstrap

      - name: Build bootstrap
        run: cmake --build build/windows-bootstrap --config Release
