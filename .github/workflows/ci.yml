name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format
        run: cargo fmt --all --check

      - name: Check workspace
        run: cargo check --workspace

      - name: Test core
        run: cargo test -p displaymesh-core

  macos-native-harness:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Compile virtual-display harness
        run: make -C platforms/macos/harness

  windows-bootstrap:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure bootstrap
        run: cmake -S platforms/windows/bootstrap -B build/windows-bootstrap

      - name: Build bootstrap
        run: cmake --build build/windows-bootstrap --config Release
