name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate repository contract
        run: python3 scripts/validate-contract.py
      - name: Validate Apple receiver resources
        run: python3 scripts/validate-apple-receiver.py

  rust:
    needs: contract
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all --check

      - name: Check workspace
        run: cargo check --workspace --all-targets

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test workspace
        run: cargo test --workspace

  apple-receiver:
    needs: contract
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate receiver resources
        run: python3 scripts/validate-apple-receiver.py

      - name: Install pinned XcodeGen
        run: |
          curl --fail --location --silent --show-error             https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip             --output "$RUNNER_TEMP/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate Xcode project
        working-directory: platforms/apple-receiver
        run: xcodegen generate

      - name: Build receiver for iOS Simulator
        working-directory: platforms/apple-receiver
        run: |
          xcodebuild \
            -project DisplayMeshReceiver.xcodeproj \
            -scheme DisplayMeshReceiver \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run receiver unit tests
        working-directory: platforms/apple-receiver
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin)["devices"]; print(next(device["udid"] for devices in data.values() for device in devices if device.get("isAvailable")))')
          xcodebuild \
            -project DisplayMeshReceiver.xcodeproj \
            -scheme DisplayMeshReceiver \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            test

  macos-media-harness:
    needs: contract
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Build low-latency media harness
        run: swift build --package-path platforms/macos/media-harness

      - name: Test DMP media contract
        run: swift test --package-path platforms/macos/media-harness

  macos-native-harness:
    needs: contract
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Compile virtual-display harness
        run: make -C platforms/macos/harness

      - name: Validate macOS session orchestrator
        run: bash -n scripts/run-macos-virtual-session.sh

  windows-input-bridge:
    needs: contract
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Configure input bridge
        run: cmake -S platforms/windows/input-bridge -B build/windows-input-bridge

      - name: Build input bridge
        run: cmake --build build/windows-input-bridge --config Release

      - name: Test binary input contract
        run: ctest --test-dir build/windows-input-bridge -C Release --output-on-failure

  windows-bootstrap:
    needs: contract
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Configure bootstrap
        run: cmake -S platforms/windows/bootstrap -B build/windows-bootstrap

      - name: Build bootstrap
        run: cmake --build build/windows-bootstrap --config Release
